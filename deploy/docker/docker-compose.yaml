version: "3.9"

services:
  bot:
    build: .
    container_name: trading_bot
    restart: always
    volumes:
      - .:/app
    environment:
      - PORT=8080
    ports:
      - "8080:8080"

  loki:
    image: grafana/loki:2.8.0
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.8.0
    volumes:
      - /var/log:/var/log
      - ./deploy/promtail/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
